<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get a Job! | My Applications Dashboard</title>
  <link rel="stylesheet" href="styles/normalize.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/style.css">
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
</head>

<body>
  <header>
    <h1>My Applications</h1>
  </header>

  <main>

    <!-- Template for Job Cards -->
    <template id="job-card-template">
      <article class="job-card">
        <div class="main-info-subcard" id="main-info">
          <div class="job-title-box" id="job-title-box">
            <!-- H3 for job -->
          </div>
          <div class="job-info-box" id="job-info-box">
            <!-- p for date -->
            <div class="job-info-subbox" id="job-info-subbox">
              <!-- p for company -->
              <!-- p for location -->
            </div>
          </div>
        </div>
        <div class="detailed-info-subcard" id="sub-info">
          <div class="notes-box">
            <h5>Notes:</h5>
            <ul id="notes-box-ul">
              <!-- List item notes -->
            </ul>
          </div>
          <div class="tags-box">
            <h5>Tags:</h5>
            <div class="tags-subbox" id="tags-subbox">
              <!-- p for each tag -->
            </div>
          </div>
          <div class="resume-file-box">
            <h5>Resume Used:</h5>
            <p>Resume</p> <!-- TODO: Figure out downloading icon -->
          </div>
        </div>
      </article>
    </template>

    <!-- Add New Application Modal -->
    <div class="modal fade" id="addApplicationModal" tabindex="-1" aria-labelledby="addApplicationModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="addApplicationModalLabel">Add New Application</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <label for="title">Job Title:</label>
              <input type="text" id="title" name="title" placeholder="Software Engineer" required>
              <br>
              <label for="company">Company:</label>
              <input type="text" id="company" name="company" placeholder="Amazon Web Services" required>
              <br>
              <label for="location">Location:</label>
              <input type="text" id="location" name="location" placeholder="Cupertino, CA" required> <!--TODO: Can I autofill this form -->
              <br>
              <!-- Status -->
              <label for="status">Status:</label><br>
              <label for="interested">Interested</label>
              <input type="radio" id="interested" name="status" value="Interested" required><br>
              <label for="applied">Applied</label>
              <input type="radio" id="applied" name="status" value="Applied"><br>
              <label for="interviewing">Interviewing</label>
              <input type="radio" id="interviewing" name="status" value="Interviewing"><br>
              <label for="rejected">Rejected</label>
              <input type="radio" id="rejected" name="status" value="Rejected"><br>
              <label for="offered">Offered</label>
              <input type="radio" id="offered" name="status" value="Offered">
              <br>
              <label for="date">Date Applied:</label>
              <input type="date" name="date" id="date" required><br>
              <!-- Tags -->
              <label for="tags">Tags:</label>
              <div id="tags-section">
                <input type="text" name="tags" id="tag1" placeholder="Top Choice">
                <input type="color" name="tags-color" id="tag-color1">
              </div>
              <button id="new-tag-button">Add a Tag</button>
              <br>
              <!-- Notes -->
              <label for="notes">Notes:</label>
              <div id="notes-section">
                <input type="text" name="notes" id="note1" placeholder="Salary starts at $75k">
              </div>
              <button id="new-note-button">Add a Note</button>
              <br>
              <!-- Resume -->
              <label for="resume">Resume Used for Application:</label>
              <input type="file" name="resume" id="resume">
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary" id="new-application-save-button">Save changes</button>
          </div>
        </div>
      </div>
    </div>


  </main>


  <footer>

  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="scripts/displayApplications.js"></script>
</body>
</html>
